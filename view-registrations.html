<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View registrations — ShareMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="sharemelandingpage.html" class="logo">ShareMe</a>
      <nav class="nav">
        <a href="view-database.html" class="link">View database</a>
        <span class="nav-divider" aria-hidden="true">|</span>
        <a href="#" id="admin-logout" class="link">Logout</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="registrations-section">
      <h1>Registered users</h1>
      <div id="reactivation-notification" class="reactivation-notification" role="status" style="display: none;"></div>
      <div id="registrations-content">
        <p class="registrations-empty">Loading…</p>
      </div>
      <a href="view-database.html" class="back-link">View database</a>
    </section>

    <div id="edit-modal" class="edit-modal" aria-hidden="true">
      <div class="edit-modal-inner">
        <h2>Edit user</h2>
        <form id="edit-form">
          <input type="hidden" id="edit-id" name="id">
          <div class="form-group">
            <label for="edit-email">Email</label>
            <input type="email" id="edit-email" name="email" required>
          </div>
          <div class="form-group">
            <label for="edit-first_name">First name</label>
            <input type="text" id="edit-first_name" name="first_name">
          </div>
          <div class="form-group">
            <label for="edit-last_name">Last name</label>
            <input type="text" id="edit-last_name" name="last_name">
          </div>
          <div class="form-group">
            <label for="edit-username">Username</label>
            <input type="text" id="edit-username" name="username">
          </div>
          <div class="form-group">
            <label for="edit-phone">Phone number</label>
            <input type="tel" id="edit-phone" name="phone" required>
          </div>
          <div class="edit-modal-actions">
            <button type="button" class="btn btn-secondary btn-small" id="edit-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary btn-small">Save</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-brand">ShareMe</p>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </nav>
      <p class="footer-copy">&copy; 2026 ShareMe. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      var content = document.getElementById('registrations-content');
      var modal = document.getElementById('edit-modal');
      var editFields = ['id', 'email', 'first_name', 'last_name', 'username', 'phone'];
      var columns = [
        { key: 'id', label: 'ID' },
        { key: 'email', label: 'Email' },
        { key: 'first_name', label: 'First name' },
        { key: 'last_name', label: 'Last name' },
        { key: 'username', label: 'Username' },
        { key: 'phone', label: 'Phone number' },
        { key: 'plan_display', label: 'Tier' },
        { key: 'created_at', label: 'Created' },
        { key: 'email_verified_display', label: 'Email verified' },
        { key: 'locked_status', label: 'Status' },
        { key: '_actions', label: 'Actions' }
      ];

      function setContent(html, className) {
        content.innerHTML = html;
        if (className) content.className = className;
      }

      function api(method, path, body) {
        var opts = { method: method, headers: {} };
        if (body) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(body);
        }
        return fetch(path, opts).then(function (r) { return r.json(); });
      }

      function cellVal(row, key) {
        var v = row[key];
        return (v != null && v !== '') ? v : '—';
      }

      function fillEditForm(user) {
        editFields.forEach(function (k) {
          var el = document.getElementById('edit-' + k);
          if (el) el.value = user[k] || '';
        });
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
      }

      function closeModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
      }

      function renderTable(registrations) {
        var notificationEl = document.getElementById('reactivation-notification');
        if (notificationEl) {
          var count = (registrations || []).filter(function (r) {
            return (r.reactivation_requested_at || r.REACTIVATION_REQUESTED_AT) && (r.status || r.STATUS) === 'deactivated';
          }).length;
          if (count > 0) {
            notificationEl.textContent = count === 1
              ? '1 user has requested reactivation.'
              : count + ' users have requested reactivation.';
            notificationEl.style.display = 'block';
          } else {
            notificationEl.style.display = 'none';
          }
        }
        if (!registrations || !registrations.length) {
          setContent('<p class="registrations-empty">No registrations yet.</p>');
          return;
        }
        var thead = '<tr>' + columns.map(function (c) { return '<th>' + c.label + '</th>'; }).join('') + '</tr>';
        function isLocked(row) {
          var until = row.locked_until || row.LOCKED_UNTIL;
          return until && new Date(until) > new Date();
        }
        var rows = registrations.map(function (row) {
          var locked = isLocked(row);
          var status = row.status || row.STATUS;
          var deactivated = status === 'deactivated';
          var cells = columns.map(function (c) {
            if (c.key === '_actions') {
              var unlockBtn = locked ? '<button type="button" class="btn btn-secondary btn-small unlock-btn" data-id="' + row.id + '" title="Clear login lock so user can sign in again">Unlock</button>' : '';
              var reactivateBtn = deactivated ? '<button type="button" class="btn btn-secondary btn-small reactivate-btn" data-id="' + row.id + '" title="Reactivate this account so user can log in again">Reactivate</button>' : '';
              return '<td class="actions-cell"><div class="btn-row"><button type="button" class="btn btn-primary btn-small edit-btn" data-id="' + row.id + '">Edit</button><button type="button" class="btn btn-danger btn-small delete-btn" data-id="' + row.id + '">Delete</button>' + unlockBtn + reactivateBtn + '</div></td>';
            }
            if (c.key === 'email_verified_display') {
              var verified = row.email_verified || row.EMAIL_VERIFIED;
              return '<td>' + (verified === 1 || verified === '1' ? 'Yes' : 'No') + '</td>';
            }
            if (c.key === 'plan_display') {
              var p = (row.plan || row.PLAN || 'free').toString().toLowerCase();
              var tierLabel = p === 'pro' ? 'Pro' : 'Free';
              var tierClass = p === 'pro' ? 'tier-pro' : 'tier-free';
              return '<td><span class="' + tierClass + '">' + tierLabel + '</span></td>';
            }
            if (c.key === 'locked_status') {
              var requestedAt = row.reactivation_requested_at || row.REACTIVATION_REQUESTED_AT;
              if (status === 'deactivated' && requestedAt) return '<td><span class="status-reactivation-requested">Deactivated (reactivation requested)</span></td>';
              if (status === 'deactivated') return '<td><span class="status-deactivated">Deactivated</span></td>';
              if (locked) return '<td><span class="status-locked">Locked</span></td>';
              return '<td>—</td>';
            }
            return '<td>' + cellVal(row, c.key) + '</td>';
          }).join('');
          return '<tr data-id="' + row.id + '">' + cells + '</tr>';
        }).join('');
        setContent('<table class="registrations-table"><thead>' + thead + '</thead><tbody>' + rows + '</tbody></table>');
      }

      content.addEventListener('click', function (e) {
        var btn = e.target.closest('.edit-btn, .delete-btn, .unlock-btn, .reactivate-btn');
        if (!btn) return;
        var id = btn.getAttribute('data-id');
        if (btn.classList.contains('unlock-btn')) {
          api('POST', '/api/users/' + id + '/unlock').then(function (data) {
            if (data.ok) loadRegistrations();
            else alert(data.error || 'Unlock failed.');
          }).catch(function () { alert('Request failed.'); });
          return;
        }
        if (btn.classList.contains('reactivate-btn')) {
          api('POST', '/api/users/' + id + '/reactivate').then(function (data) {
            if (data.ok) loadRegistrations();
            else alert(data.error || 'Reactivate failed.');
          }).catch(function () { alert('Request failed.'); });
          return;
        }
        if (btn.classList.contains('delete-btn')) {
          if (!confirm('Delete this user?')) return;
          api('DELETE', '/api/users/' + id).then(function (data) {
            if (data.ok) loadRegistrations();
            else alert(data.error || 'Delete failed.');
          }).catch(function () { alert('Request failed.'); });
        } else {
          api('GET', '/api/users/' + id).then(function (data) {
            if (data.ok && data.user) fillEditForm(data.user);
          }).catch(function () { alert('Could not load user.'); });
        }
      });

      function loadRegistrations() {
        var notificationEl = document.getElementById('reactivation-notification');
        if (notificationEl) notificationEl.style.display = 'none';
        setContent('<p class="registrations-empty">Loading…</p>');
        api('GET', '/api/registrations?_t=' + Date.now()).then(function (data) {
          if (data.ok && data.registrations) renderTable(data.registrations);
          else setContent('<p class="registrations-empty">No registrations yet.</p>');
        }).catch(function () {
          setContent('<p class="registrations-error">Could not load registrations. Make sure you’re on the same server (e.g. localhost or your Render URL).</p>');
        });
      }

      document.getElementById('edit-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var id = document.getElementById('edit-id').value;
        var payload = {
          email: document.getElementById('edit-email').value.trim(),
          first_name: document.getElementById('edit-first_name').value.trim() || null,
          last_name: document.getElementById('edit-last_name').value.trim() || null,
          username: document.getElementById('edit-username').value.trim() || null,
          phone: document.getElementById('edit-phone').value.trim()
        };
        api('PUT', '/api/users/' + id, payload).then(function (data) {
          if (data.ok) { closeModal(); loadRegistrations(); }
          else alert(data.error || 'Update failed.');
        }).catch(function () { alert('Request failed.'); });
      });
      document.getElementById('edit-cancel').addEventListener('click', closeModal);

      document.getElementById('admin-logout').addEventListener('click', function (e) {
        e.preventDefault();
        fetch('/api/admin-logout', { method: 'POST', credentials: 'include' })
          .then(function () { window.location.href = 'admin-login.html'; });
      });

      loadRegistrations();
    })();
  </script>
</body>
</html>
