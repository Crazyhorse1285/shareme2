<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — ShareMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .forgot-section {
      max-width: 420px;
      margin: 2rem auto 4rem;
      padding: 2rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }
    .forgot-section h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .forgot-section .subtitle {
      margin: 0 0 1.5rem;
      font-size: 0.9375rem;
      color: var(--text-secondary);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
      font-size: 0.9375rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      font: inherit;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-page);
      color: var(--text-primary);
    }
    .form-group input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .form-hint {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin: 0.5rem 0 1rem 0;
      line-height: 1.4;
    }
    .form-error {
      color: #dc2626;
      font-size: 0.875rem;
      margin-top: 0.35rem;
      display: none;
    }
    .form-error.visible {
      display: block;
    }
    .form-success {
      color: #059669;
      font-size: 0.875rem;
      margin-top: 0.35rem;
      display: none;
    }
    .form-success.visible {
      display: block;
    }
    input.input-error {
      border-color: #dc2626;
    }
    .forgot-section .btn-block {
      margin-top: 0.5rem;
      width: 100%;
      padding: 0.75rem 1rem;
    }
    .forgot-back {
      display: inline-block;
      margin-top: 1rem;
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }
    .forgot-back:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="sharemelandingpage.html" class="logo">ShareMe</a>
      <nav class="nav">
        <a href="sharemelandingpage.html" class="link">← Back to home</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="forgot-section">
      <h1>Forgot password</h1>
      <p class="subtitle">Please enter your email for password reset.</p>
      <form action="#" method="post" id="forgot-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" inputmode="email">
          <p class="form-hint">An email will be sent to the address you provide with instructions to reset your password.</p>
          <p class="form-error" id="form-error" role="alert">Email does not exist.</p>
          <p class="form-success" id="form-success" role="status"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset instructions</button>
      </form>
      <a href="sharemelandingpage.html" class="forgot-back">← Back to login</a>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-brand">ShareMe</p>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </nav>
      <p class="footer-copy">&copy; 2026 ShareMe. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('forgot-form');
      var emailInput = document.getElementById('email');
      var formError = document.getElementById('form-error');
      var formSuccess = document.getElementById('form-success');
      var submitBtn = document.getElementById('submit-btn');

      function showError(msg) {
        formSuccess.classList.remove('visible');
        formSuccess.textContent = '';
        formError.textContent = msg || 'Email does not exist.';
        formError.classList.add('visible');
        emailInput.classList.add('input-error');
      }

      function showSuccess(msg) {
        formError.classList.remove('visible');
        formError.textContent = '';
        emailInput.classList.remove('input-error');
        formSuccess.textContent = msg;
        formSuccess.classList.add('visible');
      }

      function hideMessages() {
        formError.classList.remove('visible');
        formSuccess.classList.remove('visible');
        emailInput.classList.remove('input-error');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideMessages();
        var email = emailInput.value.trim();
        if (!email) {
          showError('Please enter your email.');
          return;
        }

        submitBtn.disabled = true;
        fetch('/api/forgot-password', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        })
          .then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
          .then(function (result) {
            if (result.data.ok) {
              showSuccess(result.data.message || 'An email will be sent to the address you provided with instructions to reset your password.');
              form.reset();
            } else {
              showError(result.data.error || 'Email does not exist.');
            }
          })
          .catch(function () {
            showError('Unable to reach server. Please try again.');
          })
          .finally(function () {
            submitBtn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
