<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login — ShareMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-section {
      max-width: 420px;
      margin: 2rem auto 4rem;
      padding: 2rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }
    .admin-section h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .admin-section .subtitle {
      margin: 0 0 1.5rem;
      font-size: 0.9375rem;
      color: var(--text-secondary);
    }
    .admin-section .form-group {
      margin-bottom: 1.25rem;
    }
    .admin-section .form-group label {
      display: block;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
      font-size: 0.9375rem;
    }
    .admin-section .form-group input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      font: inherit;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-page);
      color: var(--text-primary);
    }
    .admin-section .form-group input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .admin-section .form-error {
      color: #dc2626;
      font-size: 0.875rem;
      margin-top: 0.35rem;
      display: none;
    }
    .admin-section .form-error.visible {
      display: block;
    }
    .admin-section input.input-error {
      border-color: #dc2626;
    }
    .admin-section .btn-block {
      margin-top: 0.5rem;
      width: 100%;
      padding: 0.75rem 1rem;
    }
    .admin-back {
      display: inline-block;
      margin-top: 1rem;
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }
    .admin-back:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="sharemelandingpage.html" class="logo">ShareMe</a>
      <nav class="nav">
        <a href="sharemelandingpage.html" class="link">← Back to home</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="admin-section">
      <h1>Admin login</h1>
      <p class="subtitle">Sign in to access registrations and database views.</p>
      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-email">Email</label>
          <input type="email" id="admin-email" name="email" required placeholder="admin@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" name="password" required placeholder="Admin password" autocomplete="current-password">
        </div>
        <p class="form-error" id="admin-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="admin-submit">Sign in</button>
      </form>
      <a href="sharemelandingpage.html" class="admin-back">← Back to home</a>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-brand">ShareMe</p>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </nav>
      <p class="footer-copy">&copy; 2026 ShareMe. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('admin-login-form');
      var errorEl = document.getElementById('admin-error');
      var submitBtn = document.getElementById('admin-submit');

      function getNextUrl() {
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next');
        if (next && next.startsWith('/') && (next === '/view-registrations.html' || next === '/view-database.html')) {
          return next;
        }
        return '/view-registrations.html';
      }

      function showError(msg) {
        errorEl.textContent = msg || 'Invalid email or password.';
        errorEl.classList.add('visible');
      }

      function hideError() {
        errorEl.textContent = '';
        errorEl.classList.remove('visible');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideError();
        submitBtn.disabled = true;

        var email = document.getElementById('admin-email').value.trim();
        var password = document.getElementById('admin-password').value;
        var next = getNextUrl();

        fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password }),
          credentials: 'include'
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.ok && data.redirect) {
              window.location.href = data.redirect;
              return;
            }
            showError(data.error || 'Invalid email or password.');
            submitBtn.disabled = false;
          })
          .catch(function () {
            showError('Unable to reach server. Please try again.');
            submitBtn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
